<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flashcards Fast & Clean</title>
  <!-- Tailwind CSS via CDN pour un style rapide et léger -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans">

  <!-- En-tête -->
  <header class="p-4 border-b border-slate-800 flex justify-between items-center bg-slate-950">
    <h1 class="text-xl font-bold tracking-wide text-indigo-400">⚡ FlashCard App</h1>
    <nav class="space-x-2">
      <button id="btn-nav-decks" class="px-3 py-1.5 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-sm font-medium transition">Mes Paquets</button>
      <button id="btn-nav-add" class="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-sm font-medium transition">Ajouter une Carte</button>
    </nav>
  </header>

  <!-- Contenu Principal -->
  <main class="flex-1 max-w-3xl w-full mx-auto p-4 flex flex-col justify-center">

    <!-- VIEW 1: Liste des Paquets (Decks) -->
    <section id="view-decks" class="space-y-4">
      <div class="flex justify-between items-center mb-6">
        <h2 class="text-2xl font-semibold">Vos Paquets</h2>
        <button id="btn-create-deck" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 rounded-lg text-sm font-medium transition">+ Nouveau Paquet</button>
      </div>
      <div id="deck-list" class="grid gap-4 sm:grid-cols-2">
        <!-- Les paquets seront injectés ici via JS -->
      </div>
    </section>

    <!-- VIEW 2: Session de Révision (Study) -->
    <section id="view-study" class="hidden flex flex-col items-center">
      <div class="w-full flex justify-between items-center mb-4 text-slate-400 text-sm">
        <button id="btn-back-decks" class="hover:text-slate-200">← Retour aux paquets</button>
        <span id="study-progress">Carte 0 / 0</span>
      </div>

      <!-- Carte 3D / Flip -->
      <div id="card-container" class="w-full h-80 perspective cursor-pointer">
        <div id="card-inner" class="relative w-full h-full duration-300 transform-style-3d shadow-xl rounded-2xl">
          <!-- Recto -->
          <div class="absolute inset-0 bg-slate-800 border border-slate-700 rounded-2xl p-6 flex flex-col justify-center items-center text-center backface-hidden">
            <span class="text-xs font-semibold text-indigo-400 uppercase tracking-widest mb-2">Question / Recto</span>
            <p id="card-front-text" class="text-2xl font-medium"></p>
            <span class="text-xs text-slate-500 absolute bottom-4">Cliquer pour retourner</span>
          </div>
          <!-- Verso -->
          <div class="absolute inset-0 bg-slate-850 border border-indigo-500/30 rounded-2xl p-6 flex flex-col justify-center items-center text-center backface-hidden rotate-y-180">
            <span class="text-xs font-semibold text-emerald-400 uppercase tracking-widest mb-2">Réponse / Verso</span>
            <p id="card-back-text" class="text-2xl font-medium"></p>
          </div>
        </div>
      </div>

      <!-- Boutons d'évaluation (Anki-like) -->
      <div id="study-controls" class="w-full grid grid-cols-4 gap-2 mt-6 hidden">
        <button data-grade="1" class="py-3 bg-red-600/80 hover:bg-red-600 rounded-xl font-medium text-sm transition">À revoir<br><span class="text-xs opacity-75">(1 j)</span></button>
        <button data-grade="2" class="py-3 bg-amber-600/80 hover:bg-amber-600 rounded-xl font-medium text-sm transition">Difficile<br><span class="text-xs opacity-75">(2 j)</span></button>
        <button data-grade="3" class="py-3 bg-blue-600/80 hover:bg-blue-600 rounded-xl font-medium text-sm transition">Correct<br><span class="text-xs opacity-75">(4 j)</span></button>
        <button data-grade="4" class="py-3 bg-emerald-600/80 hover:bg-emerald-600 rounded-xl font-medium text-sm transition">Facile<br><span class="text-xs opacity-75">(7 j)</span></button>
      </div>
    </section>

    <!-- VIEW 3: Formulaire d'ajout de carte -->
    <section id="view-add-card" class="hidden max-w-md mx-auto w-full bg-slate-800 p-6 rounded-2xl border border-slate-700">
      <h2 class="text-xl font-semibold mb-4">Créer une nouvelle carte</h2>
      <form id="form-add-card" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-slate-400 mb-1">Paquet cible</label>
          <select id="select-deck" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-slate-100 focus:outline-none focus:border-indigo-500"></select>
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-400 mb-1">Recto (Question)</label>
          <textarea id="input-front" required rows="3" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-slate-100 focus:outline-none focus:border-indigo-500" placeholder="Ex: Que signifie HTML ?"></textarea>
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-400 mb-1">Verso (Réponse)</label>
          <textarea id="input-back" required rows="3" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-slate-100 focus:outline-none focus:border-indigo-500" placeholder="Ex: HyperText Markup Language"></textarea>
        </div>
        <button type="submit" class="w-full py-3 bg-indigo-600 hover:bg-indigo-500 rounded-lg font-medium transition">Sauvegarder la carte</button>
      </form>
    </section>

  </main>

  <script src="app.js"></script>
</body>
</html>
