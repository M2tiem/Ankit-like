<!DOCTYPE html>
<html lang="fr" class="h-full bg-slate-900 text-slate-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ankit - Flashcards</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="h-full flex flex-col font-sans antialiased">

  <!-- Header -->
  <header class="border-b border-slate-800 bg-slate-950/50 backdrop-blur sticky top-0 z-10">
    <div class="max-w-4xl mx-auto px-4 py-4 flex items-center justify-between">
      <h1 class="text-2xl font-bold bg-gradient-to-r from-indigo-400 to-cyan-400 bg-clip-text text-transparent">
        Ankit ⚡
      </h1>
      <div class="flex gap-2">
        <button id="btnResetData" class="px-3 py-1.5 text-xs rounded-lg border border-slate-700 text-slate-400 hover:text-white hover:border-slate-500 transition">
          Réinitialiser aux données JSON
        </button>
      </div>
    </div>
  </header>

  <!-- Container principal -->
  <main class="flex-1 max-w-4xl w-full mx-auto px-4 py-8">

    <!-- VUE 1 : Liste des Decks -->
    <section id="viewDecks" class="space-y-6">
      <div class="flex items-center justify-between">
        <h2 class="text-xl font-semibold text-slate-200">Tes paquets de révision</h2>
      </div>

      <div id="decksGrid" class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <!-- Généré dynamiquement -->
      </div>
    </section>

    <!-- VUE 2 : Session de Révision (Flashcards) -->
    <section id="viewStudy" class="hidden max-w-xl mx-auto space-y-6">
      <div class="flex items-center justify-between">
        <button id="btnBackToDecks" class="text-sm text-slate-400 hover:text-white flex items-center gap-1 transition">
          ← Retour aux paquets
        </button>
        <span id="studyProgress" class="text-xs font-mono bg-slate-800 px-3 py-1 rounded-full text-indigo-400">
          0 / 0 cartes
        </span>
      </div>

      <!-- Carte Flashcard -->
      <div id="flashcard" class="bg-slate-800 border border-slate-700 rounded-2xl p-8 min-h-[260px] flex flex-col items-center justify-center text-center cursor-pointer shadow-xl transition-all duration-300 hover:border-indigo-500/50">
        <div id="cardContent" class="text-xl font-medium text-slate-100">
          <!-- Text front / back -->
        </div>
        <p id="cardHint" class="text-xs text-slate-500 mt-6 uppercase tracking-wider">
          Clique pour voir la réponse
        </p>
      </div>

      <!-- Boutons de réponse (SM-2 Algorithm) -->
      <div id="responseButtons" class="hidden grid grid-cols-4 gap-2 pt-2">
        <button data-grade="0" class="btn-grade bg-red-950/50 text-red-400 border border-red-800/50 hover:bg-red-900/50 py-3 rounded-xl font-medium text-xs transition flex flex-col items-center">
          <span>A revoir</span>
          <span class="text-[10px] text-red-500/70 mt-0.5">&lt; 1 min</span>
        </button>
        <button data-grade="3" class="btn-grade bg-orange-950/50 text-orange-400 border border-orange-800/50 hover:bg-orange-900/50 py-3 rounded-xl font-medium text-xs transition flex flex-col items-center">
          <span>Difficile</span>
          <span class="text-[10px] text-orange-500/70 mt-0.5">1 jour</span>
        </button>
        <button data-grade="4" class="btn-grade bg-blue-950/50 text-blue-400 border border-blue-800/50 hover:bg-blue-900/50 py-3 rounded-xl font-medium text-xs transition flex flex-col items-center">
          <span>Bon</span>
          <span class="text-[10px] text-blue-500/70 mt-0.5">3 jours</span>
        </button>
        <button data-grade="5" class="btn-grade bg-emerald-950/50 text-emerald-400 border border-emerald-800/50 hover:bg-emerald-900/50 py-3 rounded-xl font-medium text-xs transition flex flex-col items-center">
          <span>Facile</span>
          <span class="text-[10px] text-emerald-500/70 mt-0.5">6 jours</span>
        </button>
      </div>
    </section>

    <!-- VUE 3 : Fin de session -->
    <section id="viewComplete" class="hidden text-center py-16 space-y-4">
      <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-emerald-500/10 text-emerald-400 mb-2">
        🎉
      </div>
      <h2 class="text-2xl font-bold text-white">Session terminée !</h2>
      <p class="text-slate-400 text-sm max-w-sm mx-auto">
        Tu as révisé toutes tes cartes dues pour ce paquet aujourd'hui.
      </p>
      <button id="btnBackHome" class="mt-4 px-6 py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white font-medium rounded-xl text-sm transition">
        Retour à l'accueil
      </button>
    </section>

  </main>

  <script src="app.js"></script>
</body>
</html>
